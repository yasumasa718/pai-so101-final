[project]
name = "pai-so101-final"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "lerobot[core_scripts,training,feetech]==0.6.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
